<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>UI-UX</title>
   <link rel="stylesheet" href="css/navBar.css">
   <link rel="stylesheet" href="css/main.css">

</head>

<body>
   <nav>
      <div class="logo-wrapper">
         <img src="img/logo1.png" alt="logo">
         <h1>TRAVEL AWAY</h1>
      </div>
      <ul>
         <li>Home</li>
         <li>Category</li>
         <li>Blog</li>
         <li>About us</li>
      </ul>
      <div class="user-account">
         <button class="btn-item">login</button>
         <button class="btn-color">Sing Up</button>
      </div>
   </nav>

   <main>
      <div class="hero-text">
         <div class="text-main">
            <h1>the whole <span>world</span> one app!</h1>
            <p>
               Looking for where to book cheap and safe
               flights? Travel away is the one stop for you.
            </p>
         </div>

         <div class="btn-main">
            <p>
               Traveling around the world has become easier
               with the app!
            </p>
            <div class="btn-app">
               <button>
                  <img src="img/play.svg" alt="Playstory">
                  <p>Download from
                     <b>Playstory</b>
                  </p>
               </button>
               <button>
                  <img src="img/app.svg" alt="Appstore">
                  <p>Download
                     <b>Appstore</b>
                  </p>
               </button>
            </div>
         </div>
      </div>
      <div class="hero-img">
         <img src="img/1.png" alt="imagens de pessoas">
      </div>
   </main>


   <script src="js/script.js"></script>
</body>

</html>
